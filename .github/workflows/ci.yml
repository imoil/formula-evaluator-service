name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Gradle Check & Pure Domain Verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'
      - name: Run Gradle check
        run: ./gradlew check --no-daemon

  frontend:
    name: Frontend (Typecheck & Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: formula-ui/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir formula-ui install --frozen-lockfile
      - name: Run Vue TypeScript check
        run: pnpm --dir formula-ui typecheck
      - name: Run Vitest suite
        run: pnpm --dir formula-ui test
