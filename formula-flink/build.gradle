dependencies {
    implementation project(':formula-core')
    implementation project(':formula-engine')

    // Apache Flink
    implementation libs.flink.java
    implementation libs.flink.streaming.java
    implementation libs.flink.clients
    implementation libs.flink.connector.kafka
    implementation libs.flink.statebackend.rocksdb

    // QuestDB ILP Client
    implementation libs.questdb.client
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Testing
    testImplementation libs.flink.test.utils
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.kafka
    testImplementation libs.spring.kafka.test
}
