spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

questdb:
  client:
    url: "http::addr=localhost:9000;auto_flush_interval=1000;"

evaluation:
  datasource:
    type: MOCK

formula:
  rules:
    topic: rule-data
    sync-on-startup: false
