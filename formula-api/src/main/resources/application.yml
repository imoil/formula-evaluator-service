spring:
  application:
    name: formula-evaluator-service

  datasource:
    # Oracle 19c Database for Unified Sensor Registry & Global Serial Numbering
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/ORCLPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:system}
    password: ${SPRING_DATASOURCE_PASSWORD:formula_password123!}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:oracle.jdbc.OracleDriver}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.OracleDialect}
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: formula-evaluator-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

questdb:
  client:
    # ILP 클라이언트 설정 문자열 (HTTP 또는 TCP)
    url: "http::addr=localhost:9000;auto_flush_interval=1000;auto_flush_rows=50000;"

# 온디맨드 평가 시 사용할 데이터 소스 설정 (QUESTDB, RDBMS, STREAMING, MOCK)
evaluation:
  datasource:
    type: QUESTDB

# 동적 룰 카프카 발행 및 Flink 브로드캐스트 동기화 설정
formula:
  rules:
    topic: ${FORMULA_RULES_TOPIC:rule-data}
    sync-on-startup: ${FORMULA_RULES_SYNC_ON_STARTUP:true}
