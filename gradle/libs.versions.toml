[versions]
java = "25"
springBoot = "3.5.16"
springDependencyManagement = "1.1.7"
flink = "1.19.0"
flinkKafka = "3.2.0-1.19"
aviator = "5.4.1"
questdbClient = "1.0.1"
postgresql = "42.7.2"
lombok = "1.18.30"
testcontainers = "1.19.7"

[libraries]
# Spring Boot Starters
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# Database / QuestDB
questdb-client = { module = "org.questdb:questdb-client", version.ref = "questdbClient" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Expression Engine
aviator = { module = "com.googlecode.aviator:aviator", version.ref = "aviator" }

# Apache Flink
flink-java = { module = "org.apache.flink:flink-java", version.ref = "flink" }
flink-streaming-java = { module = "org.apache.flink:flink-streaming-java", version.ref = "flink" }
flink-clients = { module = "org.apache.flink:flink-clients", version.ref = "flink" }
flink-connector-kafka = { module = "org.apache.flink:flink-connector-kafka", version.ref = "flinkKafka" }
flink-statebackend-rocksdb = { module = "org.apache.flink:flink-statebackend-rocksdb", version.ref = "flink" }
flink-test-utils = { module = "org.apache.flink:flink-test-utils", version.ref = "flink" }

# Testcontainers
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
